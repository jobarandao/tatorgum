/* VOICE: warm, communal, practical — a treasurer's pocket tool for a solidarity association.
   IDEA: the association's dues card — each member a row of twelve stamped months.
   PICTURE: the month stamps themselves, plus a big "collected so far" figure in FCFA.
   COLOUR and TYPE: logo green dominant, logo blue support, logo pink accent; Baloo 2 echoes the logo lettering, Nunito Sans for reading.
   LAYOUT: app shell — green header band, one column up to 760px, bottom tab bar. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f7f3,#0e1411);--card:light-dark(#ffffff,#17201b);--ink:light-dark(#13201a,#e8f1eb);
--mut:light-dark(#5b6a62,#9badA3);--line:light-dark(#dfe7e1,#27342c);
--g:#1faf5a;--gd:light-dark(#0e7a3b,#5fd894);--b:light-dark(#1e3a9e,#90a8ff);--p:light-dark(#c8175a,#ff7aa6);
--gs:light-dark(#d4f1df,#1b4430);--os:light-dark(#ffe3b8,#4d3810);--ot:light-dark(#8a4d00,#ffc76b);
--ps:light-dark(#fbd3e1,#4d1c2d);--fs:light-dark(#edf1ee,#222c26);--hd:light-dark(#139a4c,#0f3d25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Baloo 2","Nunito Sans",sans-serif;line-height:1.05;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
header{background:var(--hd);color:#fff;padding:14px max(4vw,16px) 54px}
.top{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.top>div:nth-child(2){margin-right:auto}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;padding:2px;flex:none}
.top h1{font-size:24px;letter-spacing:.2px}.top p{margin:0;font-size:13px;opacity:.9}
.yr{display:flex;align-items:center;background:rgba(255,255,255,.16);border-radius:999px}
.yr button{background:none;border:0;color:#fff;width:40px;height:40px;font-size:20px}
.yr b{font-family:"Baloo 2";font-size:18px;min-width:44px;text-align:center}
main{max-width:760px;margin:-40px auto 0;padding:0 max(3vw,12px) 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero .lab{font-size:14px;color:var(--mut);font-weight:700}
.hero .big{font-size:clamp(34px,9vw,52px);color:var(--gd);font-weight:800;margin:4px 0 6px;white-space:nowrap}
.split{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--mut)}.split b{color:var(--ink)}
.bar{height:12px;background:var(--fs);border-radius:99px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .num{font-size:26px;font-weight:800}.stat small{display:block;color:var(--mut);font-size:13px;line-height:1.3}
h2{font-size:22px;margin-bottom:10px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.trk{flex:1;width:100%;max-width:30px;background:var(--fs);border-radius:8px;position:relative;overflow:hidden}
.trk i{position:absolute;left:0;right:0;bottom:0;background:var(--g);border-radius:8px}
.trk.cur{outline:2px solid var(--b)}
.col span{font-size:13px;color:var(--mut);font-weight:700}
.legend{font-size:13px;color:var(--mut);margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.row .who{flex:1}.row .who b{display:block;font-size:16px}.row .who small{color:var(--mut);font-size:13px}
.amt{font-weight:800;white-space:nowrap;text-align:right}.amt small{display:block;font-weight:600;color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:1px 9px;white-space:nowrap}
.t-etu{background:light-dark(#e3e9fb,#1f2a52);color:var(--b)}.t-non{background:light-dark(#fde3ec,#4a1d2c);color:var(--p)}
.t-ok{background:var(--gs);color:var(--gd)}.t-late{background:var(--ps);color:var(--p)}.t-off{background:var(--fs);color:var(--mut)}
.stamps{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:8px}
.stamps i{height:22px;border-radius:5px;background:var(--fs);font-style:normal;font-size:13px;font-weight:800;display:grid;place-items:center;color:var(--mut)}
.s-ok{background:var(--gs)!important;color:var(--gd)!important}.s-part{background:var(--os)!important;color:var(--ot)!important}.s-late{background:var(--ps)!important;color:var(--p)!important}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;min-height:44px;font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--b);color:#fff;border-color:var(--b)}
.search{flex:1 1 220px;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);font-size:16px}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:800;background:var(--g);color:#fff;font-size:16px}
.btn.sec{background:var(--fs);color:var(--ink)}.btn.dang{background:var(--ps);color:var(--p)}.btn.blue{background:var(--b);color:#fff}
.btn:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;max-width:170px;text-align:center;padding:10px 4px 12px;color:var(--mut);text-decoration:none;font-weight:800;font-size:14px;border-top:3px solid transparent}
nav a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav a.on{color:var(--gd);border-top-color:var(--g)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}
.banner{background:var(--os);color:var(--ot);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px;font-weight:600}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;z-index:20;display:none;max-width:90vw}#toast.on{display:block}
.ck{display:flex;align-items:center;gap:10px;min-height:44px}.ck input{width:22px;height:22px;accent-color:var(--g)}
.log li{margin:2px 0}.ok{color:var(--gd)}.ko{color:var(--p)}
#ov{position:fixed;inset:0;background:rgba(10,20,14,.5);display:none;z-index:10;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
#sh{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){#ov{align-items:center}#sh{border-radius:22px}}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.f label{font-size:14px;font-weight:700;color:var(--mut)}
.f input,.f select,.f textarea{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);font-size:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.pm{display:grid;grid-template-columns:7em minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.pm input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);font-size:16px;text-align:right}
.pm b{font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.acts .btn{flex:1 1 140px}
table.t{width:100%;border-collapse:collapse;font-size:15px}.t td,.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.t td.r,.t th.r{text-align:right}
.t td,.t th{padding-inline:4px}.t input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 6px;background:var(--bg);font-size:16px;text-align:right}
@media(max-width:520px){nav a{font-size:12px;padding-inline:2px}.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid3 .stat:first-child{grid-column:1/-1}.top h1{font-size:20px}.top p{display:none}.months{height:120px;gap:3px}}
@media(prefers-reduced-motion:no-preference){.bar i,.trk i{transition:height .5s,width .5s}}

.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ro td,.ro th{padding:7px 4px}
.req{color:var(--p)}
.pill{display:inline-block;background:var(--p);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;margin-left:3px;vertical-align:top}
.demo{background:light-dark(#e3e9fb,#1f2a52);color:var(--b)}
.lnk{color:var(--b);font-weight:700}
.row .who small{display:block}
.gear{background:rgba(255,255,255,.16);border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-left:8px;flex:none}
.gear svg{width:22px;height:22px}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.post img{display:block;width:100%;max-height:340px;object-fit:cover;background:var(--fs)}
.post .in{padding:16px 18px}
.post h3{font-size:21px;margin:6px 0 4px}
.post .meta{color:var(--mut);font-size:14px;font-weight:700}
.post p{white-space:pre-line;margin:8px 0 0}
.when{display:flex;gap:14px;align-items:center}
.cal{flex:none;width:58px;border-radius:12px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--card)}
.cal b{display:block;background:var(--p);color:#fff;font-size:12px;padding:2px 0;text-transform:uppercase}
.cal span{display:block;font:800 24px/1.2 "Baloo 2",sans-serif;padding:2px 0}
.sec-t{font-size:19px;margin:18px 2px 10px}
.prev{max-width:100%;max-height:180px;border-radius:12px;display:block;margin-top:6px}
a.btn{text-decoration:none}
</style>
<script src="config.js"></script>

<script>
{
const CONF = window.TT_CONFIG || {};
const DEMO = !CONF.firebase || !CONF.firebase.apiKey || /COLLEZ/.test(CONF.firebase.apiKey);
const SITE_URL = location.href.split("#")[0];
const EUR_XOF = 655.957;
const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MOIS_C = ["Janv.","Févr.","Mars","Avr.","Mai","Juin","Juil.","Août","Sept.","Oct.","Nov.","Déc."];

const PAYS = {"Afrique du Sud":"+27","Algérie":"+213","Allemagne":"+49","Belgique":"+32","Bénin":"+229","Brésil":"+55","Burkina Faso":"+226","Burundi":"+257","Cameroun":"+237","Canada":"+1","Centrafrique":"+236","Chine":"+86","Comores":"+269","Congo":"+242","Côte d'Ivoire":"+225","Djibouti":"+253","Émirats arabes unis":"+971","Espagne":"+34","États-Unis":"+1","France":"+33","Gabon":"+241","Ghana":"+233","Guinée":"+224","Guinée équatoriale":"+240","Haïti":"+509","Irlande":"+353","Italie":"+39","Luxembourg":"+352","Madagascar":"+261","Mali":"+223","Maroc":"+212","Mauritanie":"+222","Niger":"+227","Nigeria":"+234","Pays-Bas":"+31","Portugal":"+351","RD Congo":"+243","Royaume-Uni":"+44","Rwanda":"+250","Sénégal":"+221","Suisse":"+41","Tchad":"+235","Togo":"+228","Tunisie":"+216"};
const DEV = {"États-Unis":"$","Togo":"FCFA"};
const DEF = {tarifs:{etu:{eur:10,usd:10,xof:5000},non:{eur:20,usd:20,xof:10000}},tauxUSD:585};
const TPL = {sujet:"Ta'Torgum Solidarity – suivi des cotisations", corps:"Bonjour {prenom},\n\nVous pouvez consulter à tout moment le suivi des cotisations de Ta'Torgum Solidarity, mois par mois, sur ce lien :\n{lien}\n\nAucun compte n'est nécessaire.\n\nEnsemble, solidaires !\nLe bureau de Ta'Torgum Solidarity"};
const nf = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const okMail = e => /^[^@\s,]+@[^@\s,]+\.[^@\s,]+$/.test((e||"").trim());
const norm = t => (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
async function sha(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function keysOf(c){ const k = []; const e = (c.email||"").trim().toLowerCase(); if(okMail(e)) k.push(await sha("e:"+e)); const t = intl(c).replace(/\D/g,""); if(t.length>=8) k.push(await sha("t:"+t)); return k; }
const sameName = (a,b) => { const n1 = norm(a.nom), n2 = norm(b.nom); if(!n1 || n1!==n2) return false; const p1 = norm(a.prenom).split(" ").filter(Boolean), p2 = norm(b.prenom).split(" ").filter(Boolean); return p1.length>0 && p2.length>0 && (p1.some(x=>p2.includes(x))); };

let api = null, isAdmin = false, userMail = "", loaded = false, slow = false, pendingR = false;
let cfg = structuredClone(DEF), tpl = {...TPL}, raw = [], contacts = {}, membres = [], inscr = [], actus = [];
let impText = "", view = "accueil", year = new Date().getFullYear(), fM = "tous", fC = "tous", q = "", sent = false;
const mail = {mode:"liste", sel:new Set(), sujet:null, corps:null};

/* ---------- calculs ---------- */
const devise = m => DEV[m.pays] || "€";
const tarif = m => { const t = cfg.tarifs?.[m.categorie === "Non étudiant" ? "non" : "etu"] || {}, c = devise(m); return Number(c === "$" ? t.usd : c === "FCFA" ? t.xof : t.eur) || 0; };
const toX = (v,cur) => cur === "FCFA" ? v : v * (cur === "$" ? Number(cfg.tauxUSD)||0 : EUR_XOF);
const moisEcoules = () => { const n = new Date(); return year < n.getFullYear() ? 12 : year > n.getFullYear() ? 0 : n.getMonth()+1; };
const pays = m => (m.pay && m.pay[year]) || Array(12).fill(null);
const money = (v,cur) => cur === "FCFA" ? nf0.format(Math.round(v)) + " FCFA" : nf.format(v) + " " + cur;
const intl = m => { const t = (m.tel||"").trim(); if(!t) return ""; if(t.startsWith("+")) return t; const i = PAYS[m.pays] || ""; return i ? i + " " + t.replace(/^0/,"") : t; };
const fullName = m => `${m.prenom||""} ${m.nom||""}`.trim();
function calc(m){
  const t = tarif(m), cur = devise(m), p = pays(m), M = moisEcoules(), actif = m.statut !== "Inactif";
  const verse = p.reduce((s,v)=>s+(Number(v)||0),0), du = actif ? t*M : 0, reste = du - verse;
  const st = p.map((v,i)=>{ v = Number(v)||0; if(t>0 && v>=t) return "ok"; if(v>0) return "part"; return actif && i<M ? "late" : ""; });
  return {t,cur,verse,du,reste,st,actif,ok: reste<=0};
}
function totals(){
  const T = {"€":{du:0,v:0,r:0},"$":{du:0,v:0,r:0},"FCFA":{du:0,v:0,r:0},etu:0,non:0,late:0,okN:0,mAtt:Array(12).fill(0),mEnc:Array(12).fill(0)};
  for(const m of membres){
    const c = calc(m), k = T[c.cur];
    k.du += c.du; k.v += c.verse; if(c.reste>0) k.r += c.reste;
    if(c.actif){ m.categorie==="Non étudiant" ? T.non++ : T.etu++; c.ok ? T.okN++ : T.late++; }
    pays(m).forEach((v,i)=>{ T.mEnc[i] += toX(Number(v)||0,c.cur); if(c.actif) T.mAtt[i] += toX(c.t,c.cur); });
  }
  const X = k => ["€","$","FCFA"].reduce((s,c)=>s+toX(T[c][k],c),0); T.xDu = X("du"); T.xV = X("v"); T.xR = X("r");
  return T;
}
const merge = () => { membres = raw.map(m=>({...m,...(contacts[m.id]||{})})).sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr")||(a.prenom||"").localeCompare(b.prenom||"","fr")); };
const cfgFrom = d => { cfg = d ? {tarifs:{etu:{...DEF.tarifs.etu,...(d.tarifs?.etu||{})},non:{...DEF.tarifs.non,...(d.tarifs?.non||{})}},tauxUSD:d.tauxUSD ?? DEF.tauxUSD} : structuredClone(DEF); };

  reglages:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  actus:'<path d="M4 5h13a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  bureau:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};
const tabs = () => isAdmin ? [["accueil","Accueil"],["actus","Actus"],["membres","Membres"],["cotisations","Cotisations"],["emails","E-mails"]]
                           : [["accueil","Accueil"],["actus","Actus"],["cotisations","Cotisations"],["inscription","S'inscrire"],["bureau","Bureau"]];
function renderNav(){
  $("nav").innerHTML = tabs().map(([k,l])=>`<a href="#${k}" class="${view===k?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICON[k]}</svg>${l}${k==="membres"&&inscr.length?`<span class="pill">${inscr.length}</span>`:""}</a>`).join("");
}
function route(){
  const h = location.hash.slice(1), ok = tabs().map(t=>t[0]).concat(isAdmin?["reglages"]:[]);
  view = ok.includes(h) ? h : (h==="reglages"||h==="membres"||h==="emails") && !isAdmin ? "bureau" : "accueil";
  render();
}

/* ---------- vues ---------- */
function render(){
  $("yLab").textContent = year; renderNav(); $("gear").hidden = !isAdmin;
  const app = $("app");
  if(!loaded){ app.innerHTML = `<div class="card empty">${slow ? "Les données ne sont pas joignables pour le moment. Réessayez dans un instant." : "Chargement…"}</div>`; return; }
  const ban = DEMO ? `<div class="banner demo">Mode démonstration : le site n'est pas encore relié à sa base de données (fichier config.js). Rien n'est enregistré.</div>` : "";
  const V = {actus:vActus,accueil:vAccueil,membres:vMembres,cotisations:vCotis,inscription:vInscription,emails:vEmails,reglages:vReglages,bureau:vBureau};
  app.innerHTML = ban + (V[view]||vAccueil)();
  if(view==="inscription" && !sent) updTarif();
}
function renderSoft(){ const a = document.activeElement; if(a && $("app").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id!=="q" && a.type!=="checkbox"){ pendingR = true; return; } render(); }
document.addEventListener("focusout", () => { if(pendingR){ pendingR = false; setTimeout(renderSoft, 60); } });

const nowIso = () => new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const upcoming = () => actus.filter(a=>a.type==="activite" && a.quand && a.quand >= nowIso().slice(0,10)).sort((a,b)=>a.quand.localeCompare(b.quand));
const fil = () => { const up = new Set(upcoming()); return actus.filter(a=>!up.has(a)).sort((a,b)=>(b.quand||new Date(b.date||0).toISOString()).localeCompare(a.quand||new Date(a.date||0).toISOString())); };
const fmtQuand = q => { const d = new Date(q); return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + (q.length>10 && q.slice(11,16)!=="00:00" ? " à " + q.slice(11,16).replace(":","h") : ""); };
function postHtml(a, compact, kicker){
  const isAct = a.type==="activite", d = a.quand ? new Date(a.quand) : null;
  return `<article class="post">${a.image && !compact ? `<img src="${esc(a.image)}" alt="">` : ""}<div class="in">${kicker?`<div class="meta" style="color:var(--p);margin-bottom:6px">${kicker}</div>`:""}
    ${isAct && d ? `<div class="when"><div class="cal"><b>${d.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")}</b><span>${d.getDate()}</span></div><div><span class="tag t-non">Activité</span><h3>${esc(a.titre)}</h3><div class="meta">${esc(fmtQuand(a.quand))}${a.lieu?" · "+esc(a.lieu):""}</div></div></div>`
                 : `<span class="tag t-etu">Actualité</span><h3>${esc(a.titre)}</h3><div class="meta">Publié le ${new Date(a.date||Date.now()).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</div>`}
    ${a.texte ? `<p>${esc(compact && a.texte.length>220 ? a.texte.slice(0,220)+"…" : a.texte)}</p>` : ""}
    ${compact ? `<div class="acts"><a class="btn sec" href="#actus" style="display:grid;place-items:center">Voir les actus</a></div>` : isAdmin ? `<div class="acts"><button class="btn sec" data-act="editA" data-id="${a.id}">Modifier</button><button class="btn blue" data-act="mailA" data-id="${a.id}">Envoyer à la liste</button></div>` : ""}
  </div></article>`;
}
function vActus(){
  const up = upcoming(), f = fil();
  return `${isAdmin?`<div class="tools"><button class="btn" data-act="newA" style="flex:1">+ Publier une actualité ou une activité</button></div>`:""}
  ${up.length?`<h2 class="sec-t">À venir</h2>${up.map(a=>postHtml(a)).join("")}`:""}
  <h2 class="sec-t">${up.length?"Actualités":"Actualités et activités"}</h2>
  ${f.length ? f.map(a=>postHtml(a)).join("") : `<div class="card empty">Aucune actualité pour le moment.${isAdmin?"":" Revenez bientôt !"}</div>`}`;
}
function vAccueil(){
  const nx = upcoming()[0], la = fil()[0];
  const top = nx ? postHtml(nx,true,"Prochaine activité") : la ? postHtml(la,true,"Dernière actualité") : "";
  return top + vAccueilCotis();
}
function vAccueilCotis(){
  const T = totals(), taux = T.xDu ? Math.min(100, T.xV/T.xDu*100) : 0, M = moisEcoules(), max = Math.max(1,...T.mAtt,...T.mEnc);
  if(!membres.length) return `<div class="card empty"><h2>Bienvenue</h2><p>Aucun membre enregistré pour l'instant.</p>${isAdmin?`<a class="btn" href="#reglages" style="display:inline-grid;place-items:center">Importer depuis Excel</a>`:`<a class="btn" href="#inscription" style="display:inline-grid;place-items:center">S'inscrire</a>`}</div>`;
  const late = isAdmin ? membres.map(m=>({m,c:calc(m)})).filter(x=>x.c.actif && x.c.reste>0).sort((a,b)=>toX(b.c.reste,b.c.cur)-toX(a.c.reste,a.c.cur)).slice(0,6) : [];
  return `<section class="card hero">
    <div class="lab">Encaissé en ${year}, à ce jour</div>
    <div class="big num">${money(T.xV,"FCFA")}</div>
    <div class="split"><span><b>${money(T["€"].v,"€")}</b> en euros</span><span><b>${money(T["$"].v,"$")}</b> en dollars</span><span><b>${money(T["FCFA"].v,"FCFA")}</b> en francs CFA</span></div>
    <div class="bar" role="img" aria-label="Taux de recouvrement ${Math.round(taux)} %"><i style="width:${taux}%"></i></div>
    <div class="split"><span><b>${nf0.format(taux)} %</b> des ${money(T.xDu,"FCFA")} attendus (${M} mois)</span></div>
    ${isAdmin?"":`<div class="hero-cta"><a class="btn" href="#cotisations" style="display:inline-grid;place-items:center">Voir le détail</a><a class="btn sec" href="#inscription" style="display:inline-grid;place-items:center">Devenir membre</a></div>`}
  </section>
  <div class="grid3">
    <div class="stat"><small>Reste à percevoir</small><div class="num" style="color:var(--p)">${money(T.xR,"FCFA")}</div><small>${money(T["€"].r,"€")} · ${money(T["$"].r,"$")} · ${money(T["FCFA"].r,"FCFA")}</small></div>
    <div class="stat"><small>Membres actifs</small><div class="num">${T.etu+T.non}</div><small>${T.etu} étudiant${T.etu>1?"s":""} · ${T.non} non étudiant${T.non>1?"s":""}</small></div>
    <div class="stat"><small>À jour / en retard</small><div class="num"><span style="color:var(--gd)">${T.okN}</span> / <span style="color:var(--p)">${T.late}</span></div><small>membres actifs</small></div>
  </div>
  <section class="card"><h2>Mois par mois</h2>
    <div class="months">${T.mAtt.map((a,i)=>`<div class="col" title="${MOIS[i]} : ${money(T.mEnc[i],"FCFA")} sur ${money(a,"FCFA")}"><div class="trk${i===M-1?" cur":""}" style="flex:none;height:${Math.max(6,a/max*100)}%"><i style="height:${a?Math.min(100,T.mEnc[i]/a*100):0}%"></i></div><span>${INI[i]}</span></div>`).join("")}</div>
    <div class="legend">Colonne grise : attendu du mois · vert : encaissé (tout converti en FCFA ; 1 € = 655,957 FCFA, 1 $ = ${nf.format(cfg.tauxUSD)} FCFA)</div>
  </section>
  ${late.length?`<section class="card"><h2>À relancer</h2><div class="list">${late.map(({m,c})=>`<button class="row" data-act="pay" data-id="${m.id}"><span class="who"><b>${esc(fullName(m))}</b><small>${esc(intl(m)||m.pays||"")}</small></span><span class="amt" style="color:var(--p)">${money(c.reste,c.cur)}</span></button>`).join("")}</div></section>`:""}`;
}
function vCotis(){
  const R = membres.map(m=>({m,c:calc(m)})).filter(({c})=> fC==="tous" || (fC==="late"&&c.actif&&!c.ok) || (fC==="ok"&&c.actif&&c.ok));
  const chip = (k,l) => `<button class="chip" aria-pressed="${fC===k}" data-fc="${k}">${l}</button>`;
  return `<div class="tools">${chip("tous","Tous")}${chip("late","En retard")}${chip("ok","À jour")}</div>
  <p class="note">${isAdmin?"Touchez un membre pour saisir ses versements.":"Touchez un membre pour voir le détail."} Vert : payé · orange : partiel · rose : mois échu impayé.</p>
  <div class="list">${R.length ? R.map(({m,c})=>`<button class="row" data-act="pay" data-id="${m.id}" style="flex-wrap:wrap"><span class="who"><b>${esc(fullName(m))}</b><small>${esc(m.categorie||"")} · ${money(c.t,c.cur)} / mois · versé ${money(c.verse,c.cur)}</small></span>
    <span class="amt">${!c.actif?`<span class="tag t-off">Inactif</span>`:c.ok?`<span class="tag t-ok">À jour</span>`:`<span class="tag t-late">${money(c.reste,c.cur)}</span>`}</span>
    <span class="stamps" style="width:100%">${c.st.map((s,i)=>`<i class="${s?"s-"+s:""}">${INI[i]}</i>`).join("")}</span></button>`).join("") : `<div class="card empty">${membres.length?"Personne dans ce filtre.":"Aucun membre pour l'instant."}</div>`}</div>`;
}
function vInscription(){
  if(sent) return `<section class="card empty"><h2>Merci !</h2><p>Votre demande d'inscription a bien été envoyée. Le bureau de Ta'Torgum Solidarity va la valider et vous contacter.</p><button class="btn sec" data-act="again">Inscrire une autre personne</button></section>`;
  const opts = Object.keys(PAYS).map(p=>`<option ${p==="France"?"selected":""}>${esc(p)}</option>`).join("");
  return `<section class="card"><h2>Devenir membre</h2><p class="note">Remplissez ce formulaire : le bureau validera votre inscription. Vos coordonnées ne sont jamais affichées publiquement.</p>
  <form id="fi" novalidate>
   <div class="two"><div class="f"><label for="iNom">Nom <span class="req">*</span></label><input id="iNom" autocomplete="family-name" required></div><div class="f"><label for="iPre">Prénom <span class="req">*</span></label><input id="iPre" autocomplete="given-name" required></div></div>
   <div class="f"><label>Catégorie</label><div class="seg" data-seg="cat"><button type="button" class="chip" aria-pressed="true" data-v="Étudiant">Étudiant</button><button type="button" class="chip" aria-pressed="false" data-v="Non étudiant">Non étudiant</button></div></div>
   <div class="f"><label for="iPays">Pays de résidence</label><select id="iPays">${opts}</select></div>
   <div class="f"><label for="iTel">Téléphone</label><input id="iTel" type="tel" inputmode="tel" autocomplete="tel" placeholder="ex. 06 12 34 56 78"></div>
   <div class="f"><label for="iMail">E-mail <span class="req">*</span></label><input id="iMail" type="email" autocomplete="email" required></div>
   <div class="f"><label for="iMsg">Message (facultatif)</label><textarea id="iMsg" rows="2" maxlength="500"></textarea></div>
   <p class="note" id="iTarif"></p>
   <label class="ck"><input type="checkbox" id="iOk"> J'accepte que l'association utilise mes coordonnées pour me contacter. <span class="req">*</span></label>
   <p class="note" id="iErr" style="color:var(--p)"></p>
   <button class="btn" type="submit" style="width:100%">Envoyer ma demande</button></form></section>`;
}
function vBureau(){
  return `<section class="card"><h2>Espace bureau</h2><p class="note">Réservé aux membres du bureau, pour saisir les versements et gérer les membres.</p>
  <form id="fl" novalidate><div class="f"><label for="lMail">E-mail</label><input id="lMail" type="email" autocomplete="username"></div>
  <div class="f"><label for="lPwd">Mot de passe</label><input id="lPwd" type="password" autocomplete="current-password"></div>
  <p class="note" id="lErr" style="color:var(--p)">${userMail && !isAdmin ? `Le compte ${esc(userMail)} n'a pas accès à l'espace bureau.` : ""}</p>
  <div class="acts"><button class="btn" type="submit">Se connecter</button><button class="btn sec" type="button" data-act="reset">Mot de passe oublié</button></div></form>
  ${DEMO?`<p class="note">Démonstration : n'importe quel e-mail et mot de passe ouvrent l'espace bureau.</p>`:""}</section>`;
}
function vMembres(){
  const s = q.toLowerCase();
  const L = membres.filter(m => (fM==="tous" || (fM==="etu"&&m.categorie!=="Non étudiant"&&m.statut!=="Inactif") || (fM==="non"&&m.categorie==="Non étudiant"&&m.statut!=="Inactif") || (fM==="inactifs"&&m.statut==="Inactif"))
    && (!s || `${m.nom} ${m.prenom} ${m.pays} ${m.tel} ${m.email}`.toLowerCase().includes(s)));
  const chip = (k,l) => `<button class="chip" aria-pressed="${fM===k}" data-fm="${k}">${l}</button>`;
  return `${inscr.length?`<section class="card"><h2>Demandes d'inscription (${inscr.length})</h2><div class="list">${inscr.map(d=>`<div class="row" style="flex-wrap:wrap"><span class="who"><b>${esc(d.prenom)} ${esc(d.nom)}</b><small>${esc(d.categorie)} · ${esc(d.pays)} · ${esc(d.email)}${d.tel?" · "+esc(d.tel):""}</small>${d.message?`<small>« ${esc(d.message)} »</small>`:""}</span>
     <span class="acts" style="margin:0;width:100%"><button class="btn" data-act="okI" data-id="${d.id}">Valider</button><button class="btn dang" data-act="noI" data-id="${d.id}">Refuser</button></span></div>`).join("")}</div></section>`:""}
  <div class="tools"><input class="search" id="q" type="search" placeholder="Rechercher un membre" value="${esc(q)}"><button class="btn" data-act="newM">+ Ajouter</button></div>
  <div class="tools">${chip("tous","Tous ("+membres.length+")")}${chip("etu","Étudiants")}${chip("non","Non étudiants")}${chip("inactifs","Inactifs")}</div>
  <div class="list">${L.length ? L.map(m=>{const c=calc(m);return `<button class="row" data-act="editM" data-id="${m.id}"><span class="who"><b>${esc(fullName(m))}</b><small>${esc(m.pays||"Pays non renseigné")}${intl(m)?" · "+esc(intl(m)):""}</small></span><span class="amt"><span class="tag ${m.categorie==="Non étudiant"?"t-non":"t-etu"}">${esc(m.categorie||"?")}</span><small>${m.statut==="Inactif"?"Inactif":money(c.t,c.cur)+" / mois"}</small></span></button>`}).join("") : `<div class="card empty">Aucun membre ne correspond.</div>`}</div>`;
}
function vEmails(){
  const L = membres.filter(m=>okMail(m.email)), inL = L.filter(m=>m.liste!==false), sans = membres.length - L.length;
  if(mail.sujet===null){ mail.sujet = tpl.sujet; mail.corps = tpl.corps; }
  const dest = mail.mode==="liste" ? inL : L.filter(m=>mail.sel.has(m.id));
  const seg = (k,l) => `<button class="chip" aria-pressed="${mail.mode===k}" data-mm="${k}">${l}</button>`;
  return `<section class="card"><h2>Écrire un e-mail</h2>
   <div class="f"><label>Destinataires</label><div class="tools" style="margin:0">${seg("liste","Toute la liste ("+inL.length+")")}${seg("choix","Choisir")}</div></div>
   ${mail.mode==="choix"?`<div class="list" style="gap:0;margin-bottom:10px">${L.map(m=>`<label class="ck"><input type="checkbox" data-sel="${m.id}" ${mail.sel.has(m.id)?"checked":""}> ${esc(fullName(m))} <span class="note">${esc(m.email)}</span></label>`).join("")}</div>`:""}
   <div class="f"><label for="mSuj">Objet</label><input id="mSuj" value="${esc(mail.sujet)}"></div>
   <div class="f"><label for="mCorps">Message</label><textarea id="mCorps" rows="9">${esc(mail.corps)}</textarea>
   <small class="note">{lien} est remplacé par le lien du site. {prenom} : le prénom si vous écrivez à une seule personne, sinon « à tous ». Les adresses sont mises en copie cachée (Cci).</small></div>
   <div class="acts"><button class="btn" data-act="mailto" ${dest.length?"":"disabled"}>Ouvrir ma messagerie (${dest.length})</button><button class="btn blue" data-act="gmail" ${dest.length?"":"disabled"}>Ouvrir dans Gmail</button><button class="btn sec" data-act="saveTpl">Enregistrer comme modèle</button></div></section>
  <section class="card"><h2>Liste de diffusion</h2>
   <p class="note">${inL.length} inscrit${inL.length>1?"s":""}. Chaque nouveau membre avec un e-mail y est ajouté automatiquement.${sans?` ${sans} membre${sans>1?"s":""} sans e-mail valide.`:""}</p>
   <div class="list" style="gap:0">${L.map(m=>`<label class="ck"><input type="checkbox" data-liste="${m.id}" ${m.liste!==false?"checked":""}> <span style="flex:1">${esc(fullName(m))}<br><span class="note">${esc(m.email)}</span></span></label>`).join("")}</div></section>`;
}
function vReglages(){
  const t = cfg.tarifs;
  return `<section class="card"><h2>Tarifs mensuels</h2>
   <table class="t"><thead><tr><th>Catégorie</th><th class="r">€</th><th class="r">$</th><th class="r">FCFA</th></tr></thead><tbody>
   <tr><td>Étudiant</td><td><input id="te1" type="number" min="0" step="0.5" value="${t.etu.eur}"></td><td><input id="tu1" type="number" min="0" step="0.5" value="${t.etu.usd}"></td><td><input id="tx1" type="number" min="0" step="500" value="${t.etu.xof}"></td></tr>
   <tr><td>Non étudiant</td><td><input id="te2" type="number" min="0" step="0.5" value="${t.non.eur}"></td><td><input id="tu2" type="number" min="0" step="0.5" value="${t.non.usd}"></td><td><input id="tx2" type="number" min="0" step="500" value="${t.non.xof}"></td></tr></tbody></table>
   <p class="note">Résidents aux États-Unis : en dollars. Au Togo : en francs CFA. Tous les autres : en euros.</p>
   <h2 style="margin-top:18px">Conversion en francs CFA</h2>
   <div class="two"><div class="f"><label>1 € = (parité fixe)</label><input value="655,957 FCFA" disabled></div>
   <div class="f"><label for="tx">1 $ = (FCFA, à mettre à jour)</label><input id="tx" type="number" min="0" step="0.01" value="${cfg.tauxUSD}"></div></div>
   <button class="btn" data-act="saveCfg">Enregistrer les réglages</button></section>
  <section class="card"><h2>Importer depuis Excel</h2><p class="note">Choisissez votre fichier de cotisations (onglets « Membres » et « Cotisations »). Les membres déjà présents, même nom et prénom, sont mis à jour, sans doublon.</p>
   <input type="file" id="xlsIn" accept=".xlsx,.xls" class="search" style="padding:10px"><p class="note" id="impMsg">${esc(impText)}</p></section>
  <section class="card"><h2>Exporter</h2><p class="note">Télécharge un fichier Excel avec les membres et les cotisations de ${year}.</p>
   <button class="btn blue" data-act="export">Télécharger en Excel</button></section>
  <section class="card"><h2>Partager le site</h2><p class="note">Lien à envoyer aux membres : ils consultent et s'inscrivent sans créer de compte.</p>
   <div class="f"><input id="siteUrl" readonly value="${esc(SITE_URL)}"></div><div class="acts"><button class="btn sec" data-copy="siteUrl">Copier le lien</button><button class="btn dang" data-act="logout">Se déconnecter</button></div>
   <p class="note">Connecté : ${esc(userMail)}</p></section>`;
}

/* ---------- fenêtres ---------- */
function openSheet(html){ $("sh").innerHTML = html; $("ov").classList.add("open"); }
function closeSheet(){ $("ov").classList.remove("open"); $("sh").innerHTML = ""; }
let tT; function toast(t,ms=2800){ const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(tT); tT = setTimeout(()=>e.classList.remove("on"), ms); }
function sheetMember(m){
  m = m || {statut:"Actif",categorie:"Étudiant",pays:"France"};
  const opts = Object.keys(PAYS).map(p=>`<option ${p===m.pays?"selected":""}>${esc(p)}</option>`).join("");
  const seg = (name,vals,cur) => `<div class="seg" data-seg="${name}">${vals.map(v=>`<button type="button" class="chip" aria-pressed="${v===cur}" data-v="${v}">${v}</button>`).join("")}</div>`;
  openSheet(`<h2>${m.id?"Modifier le membre":"Nouveau membre"}</h2><form id="fm" novalidate>
   <div class="two"><div class="f"><label for="nom">Nom</label><input id="nom" value="${esc(m.nom)}"></div><div class="f"><label for="prenom">Prénom</label><input id="prenom" value="${esc(m.prenom)}"></div></div>
   <div class="f"><label>Catégorie</label>${seg("categorie",["Étudiant","Non étudiant"],m.categorie)}</div>
   <div class="f"><label for="pays">Pays de résidence</label><select id="pays">${opts}</select></div>
   <div class="f"><label for="tel">Téléphone (sans indicatif, ou complet avec +)</label><input id="tel" inputmode="tel" value="${esc(m.tel)}"><small class="note" id="intlPrev"></small></div>
   <div class="f"><label for="email">E-mail</label><input id="email" type="email" value="${esc(m.email)}"></div>
   <label class="ck"><input type="checkbox" id="liste" ${m.liste===false?"":"checked"}> Inscrit à la liste de diffusion</label>
   <div class="two"><div class="f"><label for="adh">Date d'adhésion</label><input id="adh" type="date" value="${esc(m.adhesion)}"></div><div class="f"><label>Statut</label>${seg("statut",["Actif","Inactif"],m.statut)}</div></div>
   <div class="f"><label for="obs">Observations</label><textarea id="obs" rows="2">${esc(m.obs)}</textarea></div>
   <p class="note" id="tarifPrev"></p><p class="note" id="err" style="color:var(--p)"></p>
   <div class="acts"><button class="btn" type="submit">Enregistrer</button><button class="btn sec" type="button" data-act="close">Fermer</button>${m.id?`<button class="btn dang" type="button" data-act="delM" data-id="${m.id}">Supprimer</button>`:""}</div></form>`);
  const f = $("fm"); f.dataset.id = m.id || "";
  const upd = () => { const x = readForm(); $("intlPrev").textContent = intl(x) ? "Numéro international : " + intl(x) : ""; $("tarifPrev").textContent = `Cotisation : ${money(tarif(x),devise(x))} par mois.`; };
  f.addEventListener("input",upd); f.addEventListener("change",upd); upd();
  f.addEventListener("submit", async e => { e.preventDefault(); const x = readForm(); if(!x.nom){ $("err").textContent = "Le nom est obligatoire."; return; }
    const id = f.dataset.id, old = membres.find(z=>z.id===id);
    const pub = {nom:x.nom,prenom:x.prenom,pays:x.pays,categorie:x.categorie,statut:x.statut,pay:old?.pay||{},cree:old?.cree||Date.now()};

async function compress(file){
  const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
  let w = img.naturalWidth, h = img.naturalHeight, max = 1100, q = 0.78, out = "";
  for(let i=0;i<6;i++){ const k = Math.min(1, max/Math.max(w,h)); const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); out = c.toDataURL("image/jpeg", q); if(out.length < 450000) break; max *= 0.8; q -= 0.08; }
  URL.revokeObjectURL(url); return out;
}

const loadXLSX = () => window.XLSX ? Promise.resolve() : new Promise((ok,ko)=>{ const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
async function importXlsx(file){
  const msg = {set textContent(t){ impText = t; const e = $("impMsg"); if(e) e.textContent = t; }}; msg.textContent = "Lecture du fichier…";
  try{
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), {cellDates:true});
    const rows = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:null, raw:true, blankrows:true}) : null;
    const M = rows("Membres"), C = rows("Cotisations"), A = rows("Accueil");
    if(!M) throw new Error("Onglet « Membres » introuvable.");
    const hr = M.findIndex(r=>r && r.includes("Nom")); if(hr<0) throw new Error("Ligne d'en-tête « Nom » introuvable.");
    const H = M[hr], col = name => H.findIndex(h=>typeof h==="string" && h.trim().toLowerCase().startsWith(name.toLowerCase()));
    const ci = {nom:col("Nom"),pre:col("Prénom"),pays:col("Pays"),ind:col("Indicatif"),tel:col("Téléphone"),mail:col("E-mail"),adh:col("Date"),cat:col("Catégorie"),st:col("Statut"),obs:col("Observations")};
    let yr = year; const ay = A && A.find(r=>r && r.some(v=>v==="Année")); if(ay){ const v = ay.find(v=>typeof v==="number" && v>2000); if(v) yr = v; }
    const ch = C ? C.findIndex(r=>r && r.includes("Membre")) : -1, CH = ch>=0 ? C[ch] : [], j0 = CH.findIndex(h=>h==="Janv.");
    const list = [];
    for(let r=hr+1; r<M.length; r++){
      const R = M[r]; if(!R || !R[ci.nom] || String(R[ci.nom]).trim()==="") continue;
      const v = k => ci[k]>=0 && R[ci[k]]!=null ? String(R[ci[k]]).trim() : "";
      let pays_ = v("pays"); if(pays_ && !PAYS[pays_]) pays_ = Object.keys(PAYS).find(p=>p.toLowerCase()===pays_.toLowerCase()) || pays_;
      let tel = v("tel"); const ind = v("ind").replace(/^\+/,"");
      if(tel && ind && /^\d+$/.test(ind) && "+"+ind !== PAYS[pays_] && !tel.startsWith("+")) tel = "+" + ind + " " + tel.replace(/^0/,"");
      const d = ci.adh>=0 ? R[ci.adh] : null, adh = d instanceof Date ? new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10) : "";
      let pay = null; if(j0>=0 && C[r]){ pay = Array.from({length:12},(_,i)=>{ const x = C[r][j0+i]; return x===null||x===""||isNaN(Number(x)) ? null : Number(x); }); }
      list.push({pub:{nom:v("nom"),prenom:v("pre"),pays:pays_||"France",categorie:v("cat")==="Non étudiant"?"Non étudiant":"Étudiant",statut:v("st")==="Inactif"?"Inactif":"Actif"},
                 priv:{tel,email:v("mail").replace(/,(com|fr|net|org|be)$/i,".$1"),adhesion:adh,obs:v("obs")}, pay});
    }
    if(!list.length) throw new Error("Aucun membre trouvé dans l'onglet « Membres ».");
    let n = 0;
    for(const it of list){
      const ex = membres.find(m=>(m.nom||"").toLowerCase()===it.pub.nom.toLowerCase() && (m.prenom||"").toLowerCase()===it.pub.prenom.toLowerCase());
      const pub = {...it.pub, pay:{...(ex?.pay||{}), ...(it.pay?{[yr]:it.pay}:{})}, cree: ex?.cree || Date.now()+n};
      const priv = {...it.priv, liste: ex ? ex.liste !== false : true};
      await api.saveMember(ex?.id||null, pub, priv); n++; msg.textContent = `Import… ${n}/${list.length}`;
    }
    msg.textContent = `${n} membre${n>1?"s":""} importé${n>1?"s":""} (versements ${yr}).`; toast("Import terminé");
  }catch(e){ msg.textContent = "Import impossible : " + (e.message && !/permission/i.test(e.message) ? e.message : errMsg(e)); }
}
async function exportXlsx(){
  try{ await loadXLSX();
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Nom","Prénom","Catégorie","Statut","Pays de résidence","N° international","E-mail","Liste de diffusion","Date d'adhésion","Devise","Cotisation mensuelle","Observations"]]
      .concat(membres.map(m=>[m.nom,m.prenom,m.categorie,m.statut,m.pays,intl(m),m.email,m.liste===false?"non":"oui",m.adhesion,devise(m),tarif(m),m.obs]))), "Membres");

}

  if(t.dataset.liste){ try{ await api.setListe(t.dataset.liste, t.checked); toast(t.checked ? "Ajouté à la liste" : "Retiré de la liste"); }catch(er){ t.checked = !t.checked; toast(errMsg(er)); } } });
$("ov").addEventListener("click", e => { if(e.target.id==="ov") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
$("yPrev").onclick = () => { year--; render(); };
$("yNext").onclick = () => { year++; render(); };
addEventListener("hashchange", route);

/* ---------- données : démonstration ---------- */
function demoApi(){
  let n = 0; const id = () => "d" + (++n) + Date.now().toString(36);
  const up = () => { merge(); renderSoft(); };
  return {
    start(){ loaded = true; up(); },
    saveMember: async (i,pub,priv) => { const k = i || id(); const r = raw.find(x=>x.id===k); if(r) Object.assign(r,pub); else raw.push({...pub,id:k}); contacts[k] = {...priv}; up(); return k; },
    delMember: async i => { raw = raw.filter(x=>x.id!==i); delete contacts[i]; up(); },
    savePay: async (i,y,arr) => { const r = raw.find(x=>x.id===i); r.pay = {...(r.pay||{}),[y]:arr}; up(); },
    saveCfg: async c => { cfgFrom(c); up(); }, saveTpl: async t => { tpl = t; },
    setListe: async (i,v) => { contacts[i] = {...(contacts[i]||{}),liste:v}; up(); },
    addInscr: async (d,k) => { if(inscr.some(x=>x.id===k)) throw {code:"permission-denied"}; inscr.push({...d,id:k||id()}); },
    hasKey: async k => { for(const c of Object.values(contacts)){ if((await keysOf({...c,pays:raw.find(r=>contacts[r.id]===c)?.pays})).includes(k)) return true; } return false; },
    saveActu: async (i,d) => { if(i){ Object.assign(actus.find(x=>x.id===i), d); } else actus.push({...d,id:id()}); up(); },
    delActu: async i => { actus = actus.filter(x=>x.id!==i); up(); }, delInscr: async i => { inscr = inscr.filter(x=>x.id!==i); up(); },
    login: async em => { isAdmin = true; userMail = em; location.hash = "accueil"; route(); }, logout: async () => { isAdmin = false; userMail = ""; route(); }, reset: async () => {}
  };
}
/* ---------- données : Firebase ---------- */
async function firebaseApi(){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [A,F,U] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-firestore.js"), import(base+"firebase-auth.js")]);
  const app = A.initializeApp(CONF.firebase), fs = F.getFirestore(app), auth = U.getAuth(app);
  let adminUnsubs = [], gotM = false, gotC = false;
  const done = () => { if(gotM && gotC){ loaded = true; slow = false; } merge(); renderSoft(); };
  const stopAdmin = () => { adminUnsubs.forEach(u=>u()); adminUnsubs = []; contacts = {}; inscr = []; };
  const startAdmin = () => {
    let synced = false;
    adminUnsubs.push(F.onSnapshot(F.collection(fs,"contacts"), async s => { contacts = Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); merge(); renderSoft();
      if(!synced && !s.metadata.fromCache && raw.length){ synced = true; try{ const flag = await F.getDoc(F.doc(fs,"settings","cles")); if(!flag.exists()){ const b = F.writeBatch(fs);
        for(const r of raw){ for(const k of await keysOf({...(contacts[r.id]||{}), pays:r.pays})) b.set(F.doc(fs,"cles",k),{m:r.id}); } b.set(F.doc(fs,"settings","cles"),{v:1}); await b.commit(); } }catch(_){} } }, ()=>{}));
    adminUnsubs.push(F.onSnapshot(F.query(F.collection(fs,"inscriptions"), F.orderBy("date","desc")), s => { inscr = s.docs.map(d=>({...d.data(),id:d.id})); renderSoft(); }, ()=>{}));
  };
  return {
    start(){
      const timer = setTimeout(()=>{ if(!loaded){ slow = true; render(); } }, 10000);
      F.onSnapshot(F.doc(fs,"settings","main"), {includeMetadataChanges:true}, s => { if(s.metadata.fromCache && !s.exists()) return; cfgFrom(s.exists()?s.data():null); gotC = true; done(); }, () => { gotC = true; done(); });
      F.onSnapshot(F.collection(fs,"actus"), s => { actus = s.docs.map(d=>({...d.data(),id:d.id})); if(loaded) renderSoft(); }, ()=>{});
      F.onSnapshot(F.doc(fs,"settings","mail"), s => { if(s.exists()) tpl = {...TPL,...s.data()}; }, ()=>{});
      F.onSnapshot(F.collection(fs,"membres"), {includeMetadataChanges:true}, s => { if(s.metadata.fromCache && s.empty) return; raw = s.docs.map(d=>({...d.data(),id:d.id})); gotM = true; if(gotC) clearTimeout(timer); done(); }, () => { gotM = true; done(); });
      U.onAuthStateChanged(auth, async u => {
        stopAdmin(); isAdmin = false; userMail = u?.email || "";
        if(u){ try{ isAdmin = (await F.getDoc(F.doc(fs,"admins",u.email.toLowerCase()))).exists(); }catch(_){ isAdmin = false; } }
        if(isAdmin){ startAdmin(); if(view==="bureau") location.hash = "accueil"; }
        merge(); route();
      });
    },
    saveMember: async (id,pub,priv) => { const ref = id ? F.doc(fs,"membres",id) : F.doc(F.collection(fs,"membres")); const b = F.writeBatch(fs);
      const old = id ? await keysOf({...(contacts[id]||{}), pays:(raw.find(r=>r.id===id)||{}).pays}) : [], neu = await keysOf({...priv, pays:pub.pays});
      old.filter(k=>!neu.includes(k)).forEach(k=>b.delete(F.doc(fs,"cles",k))); neu.forEach(k=>b.set(F.doc(fs,"cles",k),{m:ref.id}));
      b.set(ref,pub); b.set(F.doc(fs,"contacts",ref.id),priv); await b.commit(); return ref.id; },
    delMember: async id => { const b = F.writeBatch(fs); (await keysOf({...(contacts[id]||{}), pays:(raw.find(r=>r.id===id)||{}).pays})).forEach(k=>b.delete(F.doc(fs,"cles",k)));
      b.delete(F.doc(fs,"contacts",id)); b.delete(F.doc(fs,"membres",id)); await b.commit(); },
    hasKey: async k => (await F.getDoc(F.doc(fs,"cles",k))).exists(),
    savePay: (id,y,arr) => F.updateDoc(F.doc(fs,"membres",id), {["pay."+y]:arr}),
    saveCfg: c => F.setDoc(F.doc(fs,"settings","main"), c),
    saveTpl: t => F.setDoc(F.doc(fs,"settings","mail"), t),
    setListe: (id,v) => F.setDoc(F.doc(fs,"contacts",id), {liste:v}, {merge:true}),
    saveActu: (id,d) => id ? F.setDoc(F.doc(fs,"actus",id), d) : F.addDoc(F.collection(fs,"actus"), d),
    delActu: id => F.deleteDoc(F.doc(fs,"actus",id)),
    addInscr: (d,k) => k ? F.setDoc(F.doc(fs,"inscriptions",k), {...d, date:F.serverTimestamp()}) : F.addDoc(F.collection(fs,"inscriptions"), {...d, date:F.serverTimestamp()}),
    delInscr: id => F.deleteDoc(F.doc(fs,"inscriptions",id)),
    login: (e,p) => U.signInWithEmailAndPassword(auth,e,p),
    logout: () => U.signOut(auth),
    reset: e => U.sendPasswordResetEmail(auth,e)
  };
}
(async () => {
  try{ api = DEMO ? demoApi() : await firebaseApi(); }
  catch(e){ $("app").innerHTML = `<div class="card empty">Impossible de charger le site. Vérifiez votre connexion internet puis rechargez la page.</div>`; return; }
  route(); api.start();
})();
}
